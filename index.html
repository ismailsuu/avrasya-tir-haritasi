<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Avrasya Tır Koridorları PWA</title>

  <!-- PWA ve WebClip Ayarları -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TırKoridor">
  
  <!-- Leaflet Harita Kütüphanesi -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .control-panel {
      position: absolute; top: 12px; left: 12px; z-index: 1000;
      background: rgba(30, 41, 59, 0.92); color: #f8fafc; padding: 14px;
      border-radius: 10px; backdrop-filter: blur(8px); max-width: 290px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
    }
    label { font-size: 13px; color: #94a3b8; font-weight: 500; }
    select {
      width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px;
      border: 1px solid #334155; background: #0f172a; color: #f8fafc;
      font-size: 14px; outline: none; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
      <span style="font-size: 20px;">🚛</span>
      <h3 style="margin: 0; font-size: 15px; font-weight: 600;">Avrasya Tır Ağı</h3>
    </div>
    <label for="routeSelect">Koridor Seçin:</label>
    <select id="routeSelect">
      <option value="all">Tüm Güzergâhlar</option>
      <option value="middle">Orta Koridor (Trans-Hazar)</option>
      <option value="north">Kuzey Koridoru</option>
    </select>
  </div>

  <div id="map"></div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker kayıt başarılı:', reg.scope))
          .catch(err => console.error('Service Worker hatası:', err));
      });
    }
  </script>
</body>
</html>
